[project]
name = "deallens"
version = "0.1.0"
description = "DealLens platform API + workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "geoalchemy2>=0.15",  # PostGIS geometry column types (§10, §11.3)
    "pgvector>=0.3",  # pgvector embedding column type (§10, listing_photos.embedding)
    "pydantic[email]>=2.9",  # [email] → email-validator, required by identity EmailStr fields
    "pydantic-settings>=2.6",
    "python-jose[cryptography]>=3.3",
    "httpx>=0.27",
    "svix>=1.44",
    "structlog>=24.4",
    "celery[redis]>=5.4",
    "redis>=5.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "aiosqlite>=0.20",
    "types-python-jose>=3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# B008: FastAPI's DI pattern (`= Depends(...)`, `= Header(...)`) requires calls in
# argument defaults — that's idiomatic here, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
